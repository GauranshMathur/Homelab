# CNPG alerting for cluster default/database (KAN-12). GitOps-managed via the
# kube-prometheus-stack Application's directory.include. Delivered to Discord by the
# Botkube prometheus source, which shows only the alert name and the description, so
# every description carries the pod and value itself.
#
# Metric notes (verified against live scrapes 2026-10-04, instances database-3/4):
# - cnpg_pg_stat_archiver_* is -1 on a replica, so archive rules are gated on
#   cnpg_pg_replication_in_recovery == 0.
# - cnpg_pg_replication_lag reads 0 when a replica has replayed everything it received,
#   even if its WAL receiver is dead. That is the Jun-Oct 2026 stale-replica case, so
#   CNPGReplicaNotStreaming and CNPGPrimaryHasNoStreamingReplica are the real guards.
# - cnpg_collector_last_available_backup_timestamp is deprecated and does not cover
#   plugin (Barman Cloud) backups. No backup-age rule is based on it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
spec:
  groups:
    - name: cnpg
      rules:
        - alert: CNPGWALArchiveFailing
          expr: |
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
            and on(namespace, pod) cnpg_pg_replication_in_recovery == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving failing on {{ $labels.pod }}"
            description: |-
              🔴 CRITICAL · {{ $labels.pod }} · WAL archiving failing
              What: no WAL segment has reached S3 for 10m, every attempt fails
              Impact: WAL piles up on the 30Gi data volume until Postgres stops
              Do: check the Barman Cloud sidecar logs and S3 access

        - alert: CNPGWALArchiveStale
          expr: |
            cnpg_pg_stat_archiver_seconds_since_last_archival > 1800
            and on(namespace, pod) cnpg_pg_replication_in_recovery == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "No WAL archived from {{ $labels.pod }} in 30m"
            description: |-
              🔴 CRITICAL · {{ $labels.pod }} · WAL archiving stuck
              What: last WAL segment archived {{ $value | humanizeDuration }} ago (normal is every 5m)
              Impact: backups are falling behind and WAL is piling up
              Do: check the Barman Cloud sidecar logs and the archiver process

        - alert: CNPGVolumeFillingUp
          expr: |
            max by (namespace, persistentvolumeclaim) (
              kubelet_volume_stats_available_bytes{namespace="default", persistentvolumeclaim=~"database-.*"}
              / kubelet_volume_stats_capacity_bytes{namespace="default", persistentvolumeclaim=~"database-.*"}
            ) < 0.25
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "CNPG volume {{ $labels.persistentvolumeclaim }} below 25% free"
            description: |-
              🔴 CRITICAL · {{ $labels.persistentvolumeclaim }} · database volume filling up
              What: only {{ $value | humanizePercentage }} of the volume is free
              Impact: Postgres stops when the volume is full
              Do: look for failed WAL archiving or an inactive replication slot

        - alert: CNPGReplicaNotStreaming
          expr: cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Replica {{ $labels.pod }} is not streaming"
            description: |-
              🔴 CRITICAL · {{ $labels.pod }} · replica not streaming
              What: the replica has had no WAL receiver for 10m
              Impact: it is going stale while CNPG may still show it Ready
              Do: do NOT promote it; check the replica pod logs

        - alert: CNPGPrimaryHasNoStreamingReplica
          expr: |
            cnpg_pg_replication_streaming_replicas < 1
            and on(namespace, pod) cnpg_pg_replication_in_recovery == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Primary {{ $labels.pod }} has no streaming replica"
            description: |-
              🔴 CRITICAL · {{ $labels.pod }} · primary has no replica
              What: {{ $value }} replicas streaming for 10m, expected 1
              Impact: no failover target if the primary dies
              Do: check the replica pod is running and connected

        - alert: CNPGReplicaLagging
          expr: cnpg_pg_replication_lag > 300
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Replica {{ $labels.pod }} is lagging"
            description: |-
              🟡 WARNING · {{ $labels.pod }} · replica lagging
              What: {{ $value | humanizeDuration }} behind the primary
              Impact: a failover now would lose recent writes
              Do: check replica load and the network to the primary

# ArgoCD Helm Values for Homelab
global:
  domain: argocd.arkhaya.duckdns.org

configs:
  params:
    # Run in insecure mode since Traefik handles TLS
    server.insecure: true
  cm:
    # URL for accessing ArgoCD
    url: "https://argocd.arkhaya.duckdns.org"
    # Check for updates every 3 minutes (default is 3m)
    timeout.reconciliation: "180s"
    # Local account for CLI automation - apiKey only (no UI login), token stored locally
    accounts.claude: "apiKey"
    # Set by hand on the live cluster before this file was ever applied; kept so an upgrade cannot drop it
    accounts.admin: "apiKey, login"
  rbac:
    policy.csv: |
      p, claude, applications, get, */*, allow
      p, claude, applications, sync, */*, allow
      p, claude, projects, get, *, allow

# Resources sized from 7 days of real usage (2026-10-05): requests near actual use,
# memory limits with headroom, and no CPU limits (they caused throttling on other apps
# here). The worker node is short on unreserved CPU, so keep CPU requests small.
server:
  # Part of the original install; redundant with configs.params server.insecure but kept for parity
  extraArgs:
    - --insecure
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi
  ingress:
    enabled: false

controller:
  resources:
    requests:
      cpu: 50m
      memory: 640Mi
    limits:
      memory: 1536Mi

repoServer:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
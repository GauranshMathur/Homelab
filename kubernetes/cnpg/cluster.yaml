apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: database
  # REQUIRED: a duplicate Cluster named "database" also exists in the argo-cd
  # namespace, and the default kubectl context points at argo-cd. Without this,
  # `kubectl apply -f` silently targets the wrong cluster.
  namespace: default
spec:
  instances: 2
  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      max_slot_wal_keep_size: "2048MB"
      autovacuum_vacuum_scale_factor: "0.05"
      autovacuum_analyze_scale_factor: "0.02"
      autovacuum_naptime: "30s"

  # Base backups + continuous WAL archiving to S3 via the Barman Cloud plugin
  # (objectstore.yaml). Without a WAL archive a lagging replica can never catch
  # up and pg_rewind cannot rejoin a diverged instance (2026-10-01 incident).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: database-backup

  storage:
    size: 30Gi
    storageClass: synostorage

  monitoring:
    enablePodMonitor: true

  managed:
    roles:
      - name: n8n_user
        ensure: present
        login: true
        passwordSecret:
          name: n8n-user-secret
      - name: authentik_user
        ensure: present
        login: true
        passwordSecret:
          name: authentik-user-secret
      # Role name must match the database name - Jellystat's create_database.js
      # connects with no database specified, so node-pg falls back to the user name.
      - name: jellystat
        ensure: present
        login: true
        passwordSecret:
          name: jellystat-user-secret

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: arr-stack
  labels:
    app: flaresolverr
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
        - name: flaresolverr
          # Cloudflare-challenge solver used by Prowlarr (indexer proxy) for 1337x.
          # Drop-in alternative if this stops solving challenges: ghcr.io/thephaseless/byparr (same port/API).
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: TZ
              value: "Asia/Singapore"
          ports:
            - containerPort: 8191
              name: http
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

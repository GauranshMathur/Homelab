apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr2
  namespace: arr-stack
  labels:
    app: radarr2
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr2
  template:
    metadata:
      labels:
        app: radarr2
      annotations:
        backup.velero.io/backup-volumes: radarr2-config
    spec:
      containers:
        - name: radarr2
          image: lscr.io/linuxserver/radarr:6.3.0.10514-ls315
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Singapore"
          ports:
            - containerPort: 7878
              name: http
          volumeMounts:
            - name: radarr2-config
              mountPath: /config
            - name: nfs-nas
              mountPath: /NAS
          livenessProbe:
            httpGet:
              path: /
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 7878
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              memory: "320Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"

      volumes:
        - name: radarr2-config
          persistentVolumeClaim:
            claimName: radarr2-config
        - name: nfs-nas
          nfs:
            server: 192.168.10.101
            path: /volume1/NAS

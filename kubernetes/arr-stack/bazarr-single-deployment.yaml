apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: arr-stack
  labels:
    app: bazarr
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
      annotations:
        backup.velero.io/backup-volumes: bazarr-config
    spec:
      containers:
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:v1.6.2-ls368
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Asia/Singapore"
        - name: DOTNET_SENTRY_ENABLED
          value: "false"
        ports:
        - containerPort: 6767
          name: http
        volumeMounts:
        - name: bazarr-config
          mountPath: /config
        - name: nfs-nas
          mountPath: /NAS
        resources:
          requests:
            memory: "320Mi"
            cpu: "25m"
          limits:
            memory: "512Mi"
            cpu: "100m"

      volumes:
      - name: bazarr-config
        persistentVolumeClaim:
          claimName: bazarr-config
      - name: nfs-nas
        nfs:
          server: 192.168.10.101
          path: /volume1/NAS